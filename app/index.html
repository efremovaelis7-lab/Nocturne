.nc-tab-go{background:none;border:0;color:inherit;font:500 calc(13px * var(--nc-fs,1)) var(--nc-ui,sans-serif);padding:8px 4px 8px 12px;display:flex;gap:7px;align-items:center;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.nc-tab-x{background:none;border:0;color:inherit;opacity:0;cursor:pointer;font:calc(15px * var(--nc-fs,1)) var(--nc-ui,sans-serif);padding:4px 9px 4px 4px;border-radius:6px}
.nc-tab:hover .nc-tab-x,.nc-tab.on .nc-tab-x,.nc-tab-x:focus-visible{opacity:.65}
.nc-tab-x:hover{opacity:1!important;color:var(--accent)}
body.writer-zen .nc-tabs{display:none}

/* Виджеты: сворачивание и выбор */
.nc-fold{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;background:none;border:0;padding:0;color:inherit;cursor:pointer;text-align:left;font:inherit}
.nc-fold strong{font:inherit}
.nc-fold-mark{color:var(--muted);font-size:calc(12px * var(--nc-fs,1))}
.widget-arranging .nc-fold{cursor:default;width:auto}
.widget-preview-card.nc-folded{padding-bottom:10px}
.widget-preview-card .widget-item-heading{display:flex;align-items:center;gap:6px}
.widget-preview-card .widget-item-heading .nc-fold{flex:1}
.widget-stack-tools{display:flex;gap:6px;flex-wrap:wrap}
.nc-widget-picker{display:flex;flex-direction:column;gap:5px;margin:4px 0 12px;padding:10px;border:1px dashed var(--border);border-radius:11px}
.nc-picker-item{display:flex;align-items:center;gap:8px;width:100%;background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:9px;padding:7px 10px;font:calc(13px * var(--nc-fs,1)) var(--nc-ui,sans-serif);cursor:pointer;text-align:left}
.nc-picker-item span{color:var(--accent);width:16px;text-align:center}
.nc-picker-item b{margin-left:auto;color:var(--muted);font-weight:600}
.nc-picker-item.on{border-color:var(--accent)}
.nc-picker-item.on b{color:var(--accent)}
.nc-widget-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.nc-plan-title{margin:2px 0 6px;font:600 calc(17px * var(--nc-fs,1) * var(--nc-hs,1)) var(--nc-head,Georgia,serif)}
.nc-plan-scroll{max-height:250px;overflow:auto;margin:8px 0 4px;padding-right:6px;overscroll-behavior:contain;scrollbar-width:thin}
.nc-plan-text{margin:0;font:calc(15px * var(--nc-fs,1) * var(--nc-hs,1))/1.75 var(--nc-head,Georgia,serif);color:var(--text);white-space:pre-wrap}
.nc-plan-goal{margin-top:9px;font-size:calc(13px * var(--nc-fs,1))}
.nc-plan-goal p{margin:3px 0 0;line-height:1.6;opacity:.9;white-space:pre-wrap}
.nc-timer{display:flex;flex-direction:column;gap:4px}
.nc-timer-clock{font:500 calc(38px * var(--nc-fs,1) * var(--nc-hs,1))/1.1 var(--nc-head,Georgia,serif);color:var(--accent);letter-spacing:1px}
.nc-timer-phase{font:calc(12px * var(--nc-fs,1)) var(--nc-ui,sans-serif);color:var(--muted)}
.nc-timer-preset{display:flex;align-items:center;gap:8px;font:calc(12px * var(--nc-fs,1)) var(--nc-ui,sans-serif);color:var(--muted);margin-top:6px}
.nc-mini-title{font:600 calc(14px * var(--nc-fs,1) * var(--nc-hs,1)) var(--nc-head,Georgia,serif);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Фокус: инструменты работают, плеер выезжает снизу */
body.writer-zen .writer-command-center:not(.np-collapsed){display:block!important}
body.writer-zen .sound-dock{display:flex!important;transform:translateY(calc(100% + 8px));transition:transform .22s ease}
body.writer-zen.nc-dock-peek .sound-dock,body.writer-zen .sound-dock:focus-within{transform:none}
.nc-dock-hint{display:none}
body.writer-zen .nc-dock-hint{display:block;position:fixed;left:50%;bottom:0;transform:translateX(-50%);z-index:29;padding:3px 14px 5px;border-radius:9px 9px 0 0;background:var(--panel);border:1px solid var(--border);border-bottom:0;color:var(--muted);font:calc(11px * var(--nc-fs,1)) var(--nc-ui,sans-serif);opacity:.55;transition:opacity .2s}
body.writer-zen.nc-dock-peek .nc-dock-hint{opacity:0}

/* Звук печати в панели инструментов */
.nc-typewriter-line{align-items:center}
.nc-typewriter-line select{max-width:220px;background:var(--panel2);color:var(--text);border:1px solid var(--frame);border-radius:8px;padding:6px 9px;font:calc(13px * var(--nc-fs,1)) var(--nc-ui,sans-serif);min-height:32px}
.nc-inline{display:inline-flex;align-items:center;gap:6px;font:calc(12px * var(--nc-fs,1)) var(--nc-ui,sans-serif);color:var(--muted)}
.nc-inline input[type=range]{width:110px}
.nc-vol-label{min-width:40px;text-align:right}
#musicVolume.nc-boost{accent-color:#e08a3c}

/* Отметка места и поиск */
::highlight(nc-stop){background-color:rgba(120,190,255,.38)}
::highlight(nc-find){background-color:rgba(255,205,70,.42)}
::highlight(nc-find-cur){background-color:rgba(255,140,30,.85);color:#1a1209}
.nc-flash{position:fixed;z-index:60;pointer-events:none;border-radius:4px;outline:3px solid rgba(90,170,255,.9);animation:ncflash 1.6s ease-out forwards}
@keyframes ncflash{0%{opacity:1}70%{opacity:.8}100%{opacity:0}}
.nc-find{position:fixed;top:84px;right:22px;z-index:1000001;display:none;align-items:center;gap:6px;padding:7px 8px 7px 12px;background:var(--panel);border:1px solid var(--accent);border-radius:12px;box-shadow:0 14px 40px #0008;color:var(--muted)}
.nc-find.on{display:flex}
body.writer-zen .nc-find{top:66px}
.nc-find input{width:min(260px,52vw);background:var(--side);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:7px 10px;font:calc(15px * var(--nc-fs,1)) var(--nc-ui,sans-serif);outline:none}
.nc-find input:focus{border-color:var(--accent)}
.nc-find-count{font:calc(12px * var(--nc-fs,1)) var(--nc-ui,sans-serif);min-width:62px;text-align:center;color:var(--muted)}
.nc-find-count.none{color:#e08080}
.nc-find .btn.icon{min-width:30px;min-height:30px;padding:0}
.nc-find-box{position:fixed;z-index:59;pointer-events:none;border-radius:3px;outline:2px solid rgba(255,140,30,.95);box-shadow:0 0 0 4px rgba(255,140,30,.25)}

/* «Редакции»: подсветка внутри полей, синхронная прокрутка */
.lab-pane textarea{min-height:max(440px,calc(100vh - 380px))}
.nc-ta-wrap{position:relative;flex:1 1 auto;display:flex;min-height:0}
.nc-ta-wrap>textarea{position:relative;z-index:1;flex:1}
.nc-ta-wrap>textarea.nc-ta-lit{background:transparent!important}
.nc-ta-mirror{position:absolute;z-index:0;overflow:hidden;white-space:pre-wrap;overflow-wrap:break-word;word-break:normal;color:transparent;box-sizing:border-box;border-style:solid;border-color:transparent;pointer-events:none;margin:0}
.nc-ta-mirror mark{color:transparent;border-radius:3px;padding:0}
.nc-ta-mirror mark.nc-mk-stop{background:rgba(120,190,255,.36);box-shadow:0 0 0 2px rgba(120,190,255,.25)}
.nc-ta-mirror mark.nc-mk-find{background:rgba(255,205,70,.45)}
.nc-ta-mirror mark.nc-mk-find-cur{background:rgba(255,140,30,.85)}
.nc-lab-sync{display:inline-flex;align-items:center;gap:7px;font:calc(13px * var(--nc-fs,1)) var(--nc-ui,sans-serif);color:var(--muted);cursor:pointer;padding:6px 10px;border:1px solid var(--border);border-radius:9px}
.nc-lab-sync input{accent-color:var(--accent)}
.nc-lab-stop{display:inline-flex;gap:6px;flex-wrap:wrap;align-items:center}
.nc-lab-pane-tools{display:flex;gap:6px;flex-wrap:wrap}

/* Подпись автора программы */
.identity .nc-author-sign{display:block;margin-top:5px;font:italic calc(13px * var(--nc-fs,1) * var(--nc-hs,1))/1.2 var(--nc-head,Georgia,serif);color:var(--accent);letter-spacing:.3px;white-space:nowrap}
.nc-credit{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:1px;padding-left:14px;border-left:1px solid var(--border);line-height:1.25;white-space:nowrap;flex:0 0 auto}
.nc-credit span{font:calc(10px * var(--nc-fs,1)) var(--nc-ui,sans-serif);letter-spacing:1px;color:var(--subtle)}
.nc-credit b{font:italic 400 calc(14px * var(--nc-fs,1) * var(--nc-hs,1)) var(--nc-head,Georgia,serif);color:var(--accent)}
@media(max-width:1020px){.nc-credit span{display:none}.nc-credit b{font-size:calc(12px * var(--nc-fs,1))}}
@media(max-width:820px){.nc-credit{display:none}}
.nc-zen-credit{display:none}
body.writer-zen .nc-zen-credit{display:block;position:fixed;left:18px;bottom:10px;z-index:28;font:italic calc(12px * var(--nc-fs,1) * var(--nc-hs,1)) var(--nc-head,Georgia,serif);color:var(--muted);opacity:.55;pointer-events:none}

/* Первое окно и напоминание о копии */
.nc-welcome-hero{text-align:center;margin:-4px 0 18px;padding:22px 16px 20px;border-radius:14px;background:radial-gradient(ellipse at 50% 0%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 70%);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
.nc-welcome-moon{font-size:calc(34px * var(--nc-fs,1));color:var(--accent);line-height:1;margin-bottom:8px}
.nc-welcome-motto{margin:0;font:italic 500 clamp(26px,4vw,34px)/1.2 Georgia,serif;color:var(--text);letter-spacing:.4px}
.nc-welcome-sub{margin:9px auto 0;max-width:430px;font:calc(15px * var(--nc-fs,1) * var(--nc-hs,1))/1.5 var(--nc-head,Georgia,serif);color:var(--muted)}
.nc-welcome-store .settings-path{margin:4px 0 8px;font:calc(12px * var(--nc-fs,1))/1.4 ui-monospace,Menlo,monospace;word-break:break-all;color:var(--muted)}
.nc-welcome-store small{display:block;margin-top:6px}
.nc-check{display:flex;gap:10px;align-items:flex-start;font:calc(14px * var(--nc-fs,1))/1.45 var(--nc-ui,sans-serif);color:var(--text);cursor:pointer;margin:10px 0}
.nc-check input{margin-top:3px;width:17px;height:17px;flex:0 0 auto;accent-color:var(--accent)}
.nc-backup-remind{position:fixed;right:22px;bottom:86px;z-index:1000000;width:min(380px,calc(100vw - 32px));background:var(--side);color:var(--text);border:1px solid var(--accent);border-radius:14px;box-shadow:0 18px 60px #000a;padding:16px 18px 12px}
.nc-backup-remind p{margin:8px 0;font:calc(14px * var(--nc-fs,1))/1.5 var(--nc-ui,sans-serif)}
.nc-backup-head{font:600 calc(17px * var(--nc-fs,1) * var(--nc-hs,1)) var(--nc-head,Georgia,serif);padding-right:24px}
.nc-backup-x{position:absolute;top:8px;right:10px;background:none;border:0;color:var(--muted);font:calc(20px * var(--nc-fs,1)) var(--nc-ui,sans-serif);cursor:pointer}
.nc-backup-off{display:block;margin-top:8px;background:none;border:0;padding:0;color:var(--subtle);font:calc(12px * var(--nc-fs,1)) var(--nc-ui,sans-serif);cursor:pointer;text-decoration:underline;text-align:left}

/* Окно поверх плеера */
.modalveil{z-index:40}

/* Итоги месяца */
.nc-month-summary{margin:12px 0 6px;padding:18px 20px;border-radius:12px;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 16%,transparent),transparent 70%);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent)}
.nc-month-line{margin:6px 0 4px;font:500 calc(22px * var(--nc-fs,1) * var(--nc-hs,1))/1.35 var(--nc-head,Georgia,serif);color:var(--text)}
.nc-month-tail{margin:0 0 10px;font:italic calc(16px * var(--nc-fs,1) * var(--nc-hs,1))/1.5 var(--nc-head,Georgia,serif);color:var(--accent)}
.nc-month-summary.empty .nc-month-line{font-size:calc(19px * var(--nc-fs,1))}
.nc-month-chips{display:flex;flex-wrap:wrap;gap:7px}
.nc-month-chips span{font:calc(13px * var(--nc-fs,1)) var(--nc-ui,sans-serif);padding:5px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--border);color:var(--text)}
.nc-month-h{margin:20px 0 8px;font:600 calc(15px * var(--nc-fs,1)) var(--nc-ui,sans-serif);color:var(--muted);letter-spacing:.3px}
.nc-month-table{display:flex;flex-direction:column;gap:2px;font:calc(13px * var(--nc-fs,1)) var(--nc-ui,sans-serif)}
.nc-mrow{display:grid;grid-template-columns:minmax(110px,1.2fr) minmax(140px,2.4fr) repeat(4,minmax(70px,1fr));gap:10px;align-items:center;padding:8px 10px;border-radius:8px}
.nc-mrow.head{color:var(--subtle);font-size:calc(11px * var(--nc-fs,1));letter-spacing:.6px;text-transform:uppercase;padding-bottom:4px}
.nc-mrow:not(.head):nth-child(even){background:color-mix(in srgb,var(--panel2) 60%,transparent)}
.nc-mrow.current{outline:1px solid color-mix(in srgb,var(--accent) 40%,transparent)}
.nc-mrow small{color:var(--accent);font-size:calc(11px * var(--nc-fs,1))}
.nc-mbar{display:grid;grid-template-columns:minmax(0,1fr) 62px;align-items:center;gap:8px;min-width:0}
.nc-mtrack{display:block;height:8px;border-radius:4px;background:color-mix(in srgb,var(--accent) 12%,transparent);overflow:hidden}
.nc-mtrack i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.nc-mbar b{text-align:right}
.nc-month-card .mini-help{margin-top:12px}
.nc-mbar b{font-weight:600;white-space:nowrap}
@media(max-width:760px){.nc-mrow{grid-template-columns:1fr 1.6fr 1fr 1fr}.nc-mrow>span:nth-child(5),.nc-mrow>span:nth-child(6){display:none}}

/* ===== RC3.8.5 ===== */
/* Выбор в окнах ввода и в настройках подсчёта */
.nc-ask-sub{font:calc(12px * var(--nc-fs,1)) var(--nc-ui,sans-serif);letter-spacing:.6px;text-transform:uppercase;color:var(--subtle)}
.nc-ask-choices{display:flex;flex-direction:column;gap:6px;margin-bottom:4px}
.nc-radio{display:flex;align-items:flex-start;gap:10px;padding:9px 12px;border:1px solid var(--border);border-radius:11px;background:var(--panel);cursor:pointer;color:var(--text)!important;font:calc(14px * var(--nc-fs,1) * var(--nc-hs,1)) var(--nc-head,Georgia,serif)!important}
.nc-radio:hover{border-color:color-mix(in srgb,var(--accent) 55%,var(--border))}
.nc-radio:has(input:checked){border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 22%,transparent)}
.nc-radio input{width:auto!important;margin:3px 0 0;accent-color:var(--accent);flex:none}
.nc-radio span{display:flex;flex-direction:column;gap:2px}
.nc-radio b{font:600 calc(15px * var(--nc-fs,1) * var(--nc-hs,1)) var(--nc-head,Georgia,serif);color:var(--text)}
.nc-radio small{font:calc(12px * var(--nc-fs,1)) var(--nc-ui,sans-serif);color:var(--muted)}
.nc-count-choices{max-width:560px;margin-top:10px}

/* Плеер прячется, пока музыка не играет; мышь у нижнего края — выезжает */
body:not(.writer-zen) .sound-dock{transition:transform .28s ease,box-shadow .28s ease}
body:not(.writer-zen):not(.nc-music-on):not(.nc-dock-peek) .sound-dock:not(:focus-within){transform:translateY(calc(100% + 10px));box-shadow:none}
/* Отступ под плеер — у колонки с содержимым, а не у страницы: боковое меню не уезжает вверх на длинных страницах,
   а пока играет музыка, низ меню («Завершить», статус сохранения) можно докрутить выше плеера. */
body:not(.writer-zen){padding-bottom:0!important}
body:not(.writer-zen) .shell>.main{padding-bottom:79px}
body:not(.writer-zen):not(.nc-music-on) .shell>.main{padding-bottom:34px}
@media(min-width:851px){body.nc-music-on:not(.writer-zen) .sidebar{padding-bottom:84px}}
@media print{.shell>.main,.sidebar{padding-bottom:0!important}}
body:not(.writer-zen):not(.nc-music-on) .nc-dock-hint{display:block;position:fixed;left:50%;bottom:0;transform:translateX(-50%);z-index:29;padding:3px 14px 5px;border-radius:9px 9px 0 0;background:var(--panel);border:1px solid var(--border);border-bottom:0;color:var(--muted);font:calc(11px * var(--nc-fs,1)) var(--nc-ui,sans-serif);opacity:.55;transition:opacity .2s}
body.nc-dock-peek .nc-dock-hint{opacity:0}
.nc-foot-credit{display:none}
body:not(.writer-zen):not(.nc-music-on) .nc-foot-credit{display:block;position:fixed;right:0;bottom:0;z-index:28;padding:4px 14px 5px;border-radius:9px 0 0 0;background:var(--panel);border:1px solid var(--border);border-right:0;border-bottom:0;font:italic calc(12px * var(--nc-fs,1) * var(--nc-hs,1)) var(--nc-head,Georgia,serif);color:var(--muted);opacity:.85;pointer-events:none;transition:opacity .2s}
body.nc-dock-peek .nc-foot-credit{opacity:0}
@media(max-width:600px){.nc-foot-credit{display:none!important}}
@media print{.nc-foot-credit,.nc-dock-hint{display:none!important}}

/* Путеводитель */
.sidebottom [data-nc-guide-open]{color:var(--accent)}
.nc-guide-veil{position:fixed;inset:0;z-index:999990;background:#070604b8;backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:18px}
.nc-guide{width:min(1120px,100%);height:min(860px,100%);display:grid;grid-template-columns:290px 1fr;background:var(--side);color:var(--text);border:1px solid var(--frame);border-radius:18px;box-shadow:0 30px 100px #000d;overflow:hidden}
.nc-guide-nav{display:flex;flex-direction:column;gap:10px;padding:20px 14px 14px 18px;border-right:1px solid var(--border);min-height:0;background:color-mix(in srgb,var(--panel) 55%,transparent)}
.nc-guide-brand{display:flex;flex-direction:column;gap:2px;padding:0 4px 4px}
.nc-guide-brand span{font:calc(11px * var(--nc-fs,1)) var(--nc-ui,sans-serif);letter-spacing:1.6px;text-transform:uppercase;color:var(--subtle)}
.nc-guide-brand b{font:600 calc(23px * var(--nc-fs,1) * var(--nc-hs,1)) var(--nc-head,Georgia,serif);letter-spacing:2px;color:var(--accent)}
.nc-guide-search{width:100%;box-sizing:border-box;background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:9px 12px;font:calc(14px * var(--nc-fs,1)) var(--nc-ui,sans-serif);outline:none}
.nc-guide-search:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.nc-guide-found{font:calc(12px * var(--nc-fs,1)) var(--nc-ui,sans-serif);color:var(--muted);min-height:15px;padding:0 4px}
.nc-guide-list{list-style:none;margin:0;padding:0 4px 0 0;overflow:auto;overscroll-behavior:contain;flex:1;min-height:0}
.nc-guide-list li[hidden]{display:none}
.nc-guide-list button{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;background:none;border:0;border-radius:9px;padding:7px 9px;color:var(--text);font:calc(14px * var(--nc-fs,1) * var(--nc-hs,1))/1.3 var(--nc-head,Georgia,serif);cursor:pointer}
.nc-guide-list button span{font:calc(11px * var(--nc-fs,1)) var(--nc-ui,sans-serif);color:var(--subtle);min-width:18px;text-align:right}
.nc-guide-list button:hover{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.nc-guide-list button.active{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.nc-guide-main{position:relative;min-height:0;display:flex}
.nc-guide-close{position:absolute;top:12px;right:14px;z-index:2;width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:var(--panel);color:var(--text);font:calc(22px * var(--nc-fs,1))/1 var(--nc-ui,sans-serif);cursor:pointer}
.nc-guide-close:hover{border-color:var(--accent);color:var(--accent)}
.nc-guide-scroll{flex:1;overflow:auto;overscroll-behavior:contain;outline:none}
.nc-guide-page{max-width:720px;margin:0 auto;padding:38px 46px 30px}
.nc-guide-cap{font:calc(11px * var(--nc-fs,1)) var(--nc-ui,sans-serif);letter-spacing:1.5px;text-transform:uppercase;color:var(--subtle)}
.nc-guide-page h2{margin:6px 40px 6px 0;font:600 calc(32px * var(--nc-fs,1) * var(--nc-hs,1))/1.2 var(--nc-head,Georgia,serif);color:var(--text)}
.nc-guide-sum{margin:0 0 18px;font:italic calc(17px * var(--nc-fs,1) * var(--nc-hs,1)) var(--nc-head,Georgia,serif);color:var(--muted)}
.nc-guide-body{font:calc(17px * var(--nc-fs,1) * var(--nc-hs,1))/1.65 var(--nc-head,Georgia,serif);color:var(--text)}
.nc-guide-body h3{margin:26px 0 8px;font:600 calc(21px * var(--nc-fs,1) * var(--nc-hs,1)) var(--nc-head,Georgia,serif);color:var(--accent)}
.nc-guide-body p{margin:0 0 12px}
.nc-guide-body ul{margin:0 0 14px;padding-left:22px}
.nc-guide-body li{margin:4px 0}
.nc-guide-body blockquote{margin:20px 0;padding:6px 18px;border-left:3px solid var(--accent);font-style:italic;color:var(--muted)}
.nc-guide-pager{display:flex;justify-content:space-between;gap:12px;margin-top:30px;padding-top:18px;border-top:1px solid var(--border)}
.nc-guide-pager .btn{max-width:48%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
::highlight(nc-guide-hit){background-color:color-mix(in srgb,var(--accent) 35%,transparent);color:inherit}
::highlight(nc-guide-cur){background-color:var(--accent);color:var(--side)}
@media(max-width:760px){.nc-guide{grid-template-columns:1fr;grid-template-rows:auto 1fr}.nc-guide-nav{max-height:38vh;border-right:0;border-bottom:1px solid var(--border)}.nc-guide-page{padding:26px 20px}.nc-guide-page h2{font-size:calc(26px * var(--nc-fs,1) * var(--nc-hs,1))}}

/* Узкая панель редактора над текстом, когда большая уехала вверх */
.nc-deskbar{position:fixed;z-index:27;display:flex;align-items:center;gap:4px;padding:6px 8px;box-sizing:border-box;background:color-mix(in srgb,var(--side) 93%,transparent);backdrop-filter:blur(12px);border:1px solid var(--frame);border-radius:12px;box-shadow:0 12px 30px #0006;animation:ncBarIn .18s ease}
.nc-deskbar[hidden]{display:none}
.nc-deskbar .format-btn,.nc-deskbar .btn{height:30px;min-width:30px;padding:0 9px;font-size:calc(13px * var(--nc-fs,1));border-radius:8px;flex:none;margin:0}
.nc-deskbar-sep{width:1px;height:20px;background:var(--border);margin:0 4px;flex:none}
.nc-deskbar-count{margin-left:auto;padding-left:8px;font:calc(12px * var(--nc-fs,1)) var(--nc-ui,sans-serif);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
@keyframes ncBarIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@media(max-width:700px){.nc-deskbar [data-rich-value],.nc-deskbar-count{display:none}}
@media print{.nc-deskbar{display:none!important}}

/* Отметки в главе — список в виджете «План главы» */
.nc-marks{margin-top:10px;border-top:1px solid var(--border);padding-top:8px}
.nc-marks-h{font:calc(11px * var(--nc-fs,1)) var(--nc-ui,sans-serif);letter-spacing:.8px;text-transform:uppercase;color:var(--subtle);margin-bottom:4px}
.nc-marks-list{max-height:170px;overflow:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:2px}
.nc-mark-row{display:flex;align-items:center;gap:4px}
.nc-mark-go{flex:1;min-width:0;display:flex;gap:8px;align-items:baseline;text-align:left;background:none;border:0;border-radius:7px;padding:5px 6px;color:var(--text);font:calc(13px * var(--nc-fs,1) * var(--nc-hs,1))/1.35 var(--nc-head,Georgia,serif);cursor:pointer}
.nc-mark-go:hover{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.nc-mark-go b{font:600 calc(12px * var(--nc-fs,1)) var(--nc-ui,sans-serif);color:var(--accent);min-width:14px;flex:none}
.nc-mark-go span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.nc-mark-x{flex:none;width:24px;height:24px;border-radius:6px;border:0;background:none;color:var(--muted);cursor:pointer;font-size:calc(16px * var(--nc-fs,1));line-height:1}
.nc-mark-x:hover{color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}

/* «Редакции»: номера отметок под окном */
.nc-lab-stop{display:inline-flex;flex-wrap:wrap;gap:6px;align-items:center}
.nc-lab-chip{display:inline-flex;align-items:center;border:1px solid var(--border);border-radius:999px;overflow:hidden;background:var(--panel)}
.nc-lab-chip button{border:0;background:none;color:var(--text);font:600 calc(12px * var(--nc-fs,1)) var(--nc-ui,sans-serif);padding:4px 8px;cursor:pointer;min-width:26px;line-height:1.2}
.nc-lab-chip button:hover{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent)}
.nc-lab-chip .nc-lab-chip-x{font-weight:400;color:var(--muted);padding:4px 7px 4px 2px;min-width:0}
.nc-lab-stop .nc-lab-chip{flex:none}
.lab-editor-footer .nc-lab-stop{flex:1 1 100%}

/* Шрифт и размер текста — блок в «Ателье оформления» */
.nc-font-sizes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:12px 0 8px}
.nc-font-sizes label{display:flex;flex-direction:column;gap:6px;font-size:calc(13px * var(--nc-fs,1));color:var(--muted)}
.nc-font-sizes label b{color:var(--accent);font-weight:600}
.nc-font-sizes input[type=range]{accent-color:var(--accent);width:100%}
.nc-font-presets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.nc-font-target{display:inline-flex;border:1px solid var(--border);border-radius:11px;overflow:hidden;margin:2px 0 6px}
.nc-font-target button{border:0;background:none;color:var(--muted);padding:8px 14px;font-size:calc(13px * var(--nc-fs,1));cursor:pointer}
.nc-font-target button.on{background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--text);font-weight:600}
.nc-font-now{margin:2px 0 8px}
.nc-font-gallery{max-height:430px;overflow:auto;overscroll-behavior:contain;padding:2px 6px 6px 2px;margin-bottom:6px}
.nc-font-group{font-size:calc(11px * var(--nc-fs,1));letter-spacing:.8px;text-transform:uppercase;color:var(--subtle);margin:10px 0 6px}
.nc-font-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.nc-font-card{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;border:1px solid var(--border);border-radius:11px;background:var(--panel);color:var(--text);padding:9px 11px;cursor:pointer;min-height:64px}
.nc-font-card:hover{border-color:color-mix(in srgb,var(--accent) 60%,var(--border))}
.nc-font-card.on{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 30%,transparent)}
.nc-font-card b{font-size:calc(22px * var(--nc-fs,1));font-weight:400;line-height:1.15}
.nc-font-card span{font-size:calc(12.5px * var(--nc-fs,1));color:var(--muted);line-height:1.25}
.nc-font-add{align-items:center;justify-content:center;border-style:dashed;font-family:inherit}
.nc-font-add b{color:var(--accent)}
.nc-font-del{position:absolute;top:4px;right:6px;font-style:normal;font-size:calc(15px * var(--nc-fs,1));line-height:1;color:var(--muted);padding:2px 4px;border-radius:6px}
.nc-font-del:hover{color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.nc-font-preview{border:1px dashed var(--border);border-radius:12px;padding:12px 16px;margin:6px 0 12px;background:color-mix(in srgb,var(--panel) 70%,transparent)}
.nc-font-preview h3{margin:0 0 6px;font:600 calc(20px * var(--nc-fs,1) * var(--nc-hs,1)) var(--nc-head,Georgia,serif);color:var(--text)}
.nc-font-preview p{margin:0;font-size:calc(14px * var(--nc-fs,1));color:var(--muted)}

/* Шапка главной: наложения работают, картинка по умолчанию окрашивается в цвет темы */
.hero.editable-hero::before{content:'';position:absolute;inset:0;z-index:-1;pointer-events:none}
.hero.editable-hero[data-library-tint="gradient"]::before{background:linear-gradient(90deg,color-mix(in srgb,var(--hero) 28%,rgba(10,8,8,.84)),color-mix(in srgb,var(--hero) 22%,rgba(10,8,8,.10)))}
.nc-hero-grade{display:none}
.hero.editable-hero.nc-hero-themed:not([data-library-tint="none"]) .nc-hero-grade{display:block;position:absolute;inset:0;z-index:-2;background:var(--hero);mix-blend-mode:color;opacity:.6;pointer-events:none}

/* RC3.8.11 — Windows: тонкие полосы прокрутки в цвет темы; боковое меню без горизонтальной прокрутки
   и чуть шире, когда текст программы крупнее обычного. */
:where(html.nc-win) *{scrollbar-width:thin}
html.nc-win{scrollbar-color:var(--nc-sb,#6a5139) transparent}
.sidebar{overflow-x:hidden}
@media(min-width:1161px){html .shell{grid-template-columns:calc(242px * min(max(var(--nc-fs,1),1),1.3)) minmax(0,1fr)}}
@media(min-width:851px) and (max-width:1160px){html .shell{grid-template-columns:calc(205px * min(max(var(--nc-fs,1),1),1.25)) minmax(0,1fr)}html .sidebar{width:auto}}
.sidebottom{grid-template-columns:minmax(0,1fr)}
.sidebottom .btn{white-space:normal;text-align:left;line-height:1.3}
#ncSaveAlarm{position:fixed;z-index:200;top:10px;left:50%;transform:translateX(-50%);width:min(860px,calc(100vw - 24px));display:flex;gap:14px;align-items:center;padding:12px 14px;border-radius:12px;background:#5a1414;color:#fff3ec;border:1px solid #c0503f;box-shadow:0 14px 40px #000a;font:calc(14px * var(--nc-fs,1))/1.45 var(--nc-ui,system-ui,sans-serif)}
#ncSaveAlarm .nc-alarm-text{flex:1;display:grid;gap:3px}
#ncSaveAlarm b{font-size:calc(15px * var(--nc-fs,1))}
#ncSaveAlarm .nc-alarm-acts{display:flex;flex-direction:column;gap:6px;flex:none}
#ncSaveAlarm .btn{width:auto;justify-content:center}
@media(max-width:700px){#ncSaveAlarm{flex-direction:column;align-items:stretch}#ncSaveAlarm .nc-alarm-acts{flex-direction:row}}

/* RC3.8.13 — «Библиотека» отдельно над «Мастерской» */
#ncHomeNav{padding:10px 10px 4px}
.navlink.nc-home-link{display:flex;align-items:center;gap:12px;width:100%;margin:0;padding:11px 13px;border-radius:12px;border:1px solid var(--frame);background:color-mix(in srgb,var(--accent) 9%,var(--side));color:var(--text);text-align:left}
.navlink.nc-home-link .symbol{font-size:calc(22px * var(--nc-fs,1));width:24px;color:var(--accent)}
.navlink.nc-home-link:hover{background:color-mix(in srgb,var(--accent) 15%,var(--side));color:var(--text)}
.navlink.nc-home-link.active{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 19%,var(--side))}
.nc-home-text{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.nc-home-text b{font:500 calc(17px * var(--nc-fs,1) * var(--nc-hs,1)) var(--nc-head,Georgia,serif)}
.nc-home-text small{font-size:calc(11px * var(--nc-fs,1));color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar-workspace-head{flex-direction:column;align-items:flex-start!important;justify-content:flex-start!important;gap:1px!important;margin-top:10px}
.nc-workshop-for{display:block;font-size:calc(11px * var(--nc-fs,1));color:var(--muted);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:0;text-transform:none}

/* меню «⋯» */
.nc-more{flex:none;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--muted);font-size:calc(16px * var(--nc-fs,1));line-height:1;cursor:pointer;padding:0}
.nc-more:hover,.nc-more[aria-expanded="true"]{background:var(--panel2);border-color:var(--frame);color:var(--text)}
.nc-lib-menu{position:fixed;z-index:120;min-width:230px;max-width:300px;padding:6px;border-radius:12px;background:var(--panel);border:1px solid var(--frame);box-shadow:0 18px 50px #000a;display:flex;flex-direction:column;gap:1px}
.nc-lib-menu-title{padding:7px 10px 6px;font-size:calc(11px * var(--nc-fs,1));color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-bottom:1px solid var(--border);margin-bottom:3px}
.nc-lib-menu button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;border-radius:8px;background:transparent;color:var(--text);font:inherit;font-size:calc(13px * var(--nc-fs,1));text-align:left;cursor:pointer}
.nc-lib-menu button .ic{width:16px;text-align:center;color:var(--accent)}
.nc-lib-menu button:hover:not([disabled]),.nc-lib-menu button:focus-visible{background:var(--panel2);outline:none}
.nc-lib-menu button[disabled]{opacity:.4;cursor:default}
.nc-lib-menu button.danger,.nc-lib-menu button.danger .ic{color:#e0857a}
.nc-lib-menu-sep{height:1px;background:var(--border);margin:4px 2px}

/* боковое меню: строки книг с «⋯», поиск */
.nc-srow{position:relative;display:flex;align-items:center}
.nc-srow>.s-book{flex:1;min-width:0}
.nc-side-more{position:absolute;right:4px;top:50%;transform:translateY(-50%);opacity:0;width:26px;height:26px}
.sideworld-head{position:relative}
.sideworld-head .nc-side-more{right:2px}
.nc-srow:hover .nc-side-more,.nc-srow:focus-within .nc-side-more,.sideworld-head:hover .nc-side-more,.sideworld-head:focus-within .nc-side-more,.nc-side-more[aria-expanded="true"]{opacity:1;background:var(--side)}
.nc-side-find{padding:4px 10px 8px}
.nc-side-find input{width:100%;box-sizing:border-box;padding:7px 10px;border-radius:8px;border:1px solid var(--frame);background:var(--panel);color:var(--text);font:inherit;font-size:calc(13px * var(--nc-fs,1))}
.nc-side-results{display:flex;flex-direction:column;margin-top:6px}
.nc-side-results .s-book{padding-left:10px}
.nc-side-results .s-book small{margin-left:auto;font-size:calc(10px * var(--nc-fs,1));color:var(--subtle);flex:none}
.nc-side-none{font-size:calc(12px * var(--nc-fs,1));color:var(--muted);padding:6px 10px}
[data-nc-drag-book][draggable="true"],[data-nc-drag-world][draggable="true"]{-webkit-user-drag:element}
.nc-drop-target{outline:2px dashed var(--accent);outline-offset:2px;border-radius:9px}
.nc-drag-src{opacity:.45}

/* библиотека: панель и вид «Список» */
.nc-lib-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:26px 0 6px;padding:10px 12px;border-radius:14px;background:var(--panel);border:1px solid var(--border)}
.nc-seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--side);border:1px solid var(--frame)}
.nc-seg button{border:0;background:transparent;color:var(--text);font:inherit;font-size:calc(13px * var(--nc-fs,1));padding:7px 12px;border-radius:8px;cursor:pointer}
.nc-seg button.on{background:var(--accent);color:#1b1410}
.nc-lib-search{flex:1 1 200px;max-width:340px;padding:8px 12px;border-radius:9px;border:1px solid var(--frame);background:var(--side);color:var(--text);font:inherit;font-size:calc(13px * var(--nc-fs,1))}
.nc-lib-sort{display:inline-flex;align-items:center;gap:6px;font-size:calc(12px * var(--nc-fs,1));color:var(--muted)}
.nc-lib-sort select{padding:6px 8px;border-radius:8px;border:1px solid var(--frame);background:var(--side);color:var(--text);font:inherit;font-size:calc(13px * var(--nc-fs,1))}
.nc-lib-count{font-size:calc(12px * var(--nc-fs,1));color:var(--muted)}
.nc-lib-grow{flex:1}
.nc-lib-tip{color:var(--accent)!important;margin:4px 2px 0}
.nc-lib-howto{margin:4px 2px 0}
.nc-lib-list{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.nc-lib-group{border:1px solid var(--border);border-radius:14px;background:var(--panel);overflow:hidden}
.nc-lib-ghead{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--panel2);border-bottom:1px solid var(--border)}
.nc-lib-group.closed .nc-lib-ghead{border-bottom:0}
.nc-lib-caret{width:28px;height:28px;border-radius:7px;border:1px solid var(--frame);background:transparent;color:var(--accent);cursor:pointer;flex:none}
.nc-lib-gname{display:inline-flex;align-items:center;gap:8px;border:0;background:transparent;color:var(--text);font:500 calc(17px * var(--nc-fs,1) * var(--nc-hs,1)) var(--nc-head,Georgia,serif);cursor:pointer;padding:4px 2px;text-align:left}
span.nc-lib-gname{cursor:default}
.nc-lib-gname .glyph{color:var(--accent)}
.nc-lib-gcount{font-size:calc(12px * var(--nc-fs,1));color:var(--muted);margin-right:auto}
.nc-lib-rows{display:flex;flex-direction:column}
.nc-lib-row{display:flex;align-items:center;gap:12px;padding:4px 10px;border-top:1px solid var(--border);min-height:46px}
.nc-lib-row:first-child{border-top:0}
.nc-lib-row:hover{background:color-mix(in srgb,var(--panel2) 60%,transparent)}
.nc-lib-row.current{background:color-mix(in srgb,var(--accent) 8%,var(--panel))}
.nc-grip{color:var(--subtle);cursor:grab;font-size:calc(12px * var(--nc-fs,1));letter-spacing:-2px;flex:none;user-select:none}
.nc-lib-open{flex:1 1 220px;min-width:0;display:flex;align-items:center;gap:12px;border:0;background:transparent;color:var(--text);cursor:pointer;text-align:left;padding:2px 0;font:inherit}
.nc-lib-thumb{width:27px;height:38px;flex:none;border-radius:3px 5px 5px 3px;overflow:hidden;background:linear-gradient(150deg,#563d33,#1a111a);display:flex;align-items:center;justify-content:center;box-shadow:inset 3px 0 4px #0006,2px 3px 6px #0005}
.nc-lib-thumb img{width:100%;height:100%;object-fit:cover}
.nc-lib-thumb span{font:calc(16px * var(--nc-fs,1) * var(--nc-hs,1)) var(--nc-head,Georgia,serif);color:#f4e6d0}
.nc-lib-title{display:flex;flex-direction:column;min-width:0}
.nc-lib-title b{font:500 calc(15px * var(--nc-fs,1) * var(--nc-hs,1)) var(--nc-head,Georgia,serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nc-lib-title small{font-size:calc(11px * var(--nc-fs,1));color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nc-lib-meta{flex:none;width:96px;font-size:calc(12px * var(--nc-fs,1));color:var(--muted);text-align:right;white-space:nowrap}
.nc-lib-when{width:84px}
.nc-lib-empty{padding:14px 16px;font-size:calc(13px * var(--nc-fs,1));color:var(--muted)}
.nc-linkish{border:0;background:none;color:var(--accent);font:inherit;padding:0;cursor:pointer;text-decoration:underline}
@media(max-width:900px){.nc-lib-meta{display:none}.nc-lib-when{display:inline}}
.nc-lib-row[hidden],.nc-tile-wrap[hidden],.nc-lib-group[hidden],.nc-shelf-block[hidden],.nc-srow[hidden],.sideworld[hidden],.s-book[hidden]{display:none!important}

/* вид «Полка»: «⋯» на обложках и вселенных */
.nc-tile-wrap{position:relative;display:flex}
.nc-tile-wrap>.booktile,.nc-tile-wrap>.world-card{flex:1}
.nc-tile-more{position:absolute;top:6px;right:6px;z-index:4;background:color-mix(in srgb,var(--side) 85%,transparent);border-color:var(--frame);opacity:0;transition:opacity .15s}
.nc-tile-wrap:hover .nc-tile-more,.nc-tile-wrap:focus-within .nc-tile-more,.nc-tile-more[aria-expanded="true"]{opacity:1}
.book-shelf .nc-tile-wrap .nc-tile-more{right:18px}
@media(hover:none){.nc-tile-more,.nc-side-more{opacity:1}}

/* корзина */
.nc-trash{margin-top:26px;border:1px dashed var(--frame);border-radius:14px;padding:12px 16px;background:var(--panel)}
.nc-trash summary{cursor:pointer;font-weight:600;color:var(--muted)}
.nc-trash[open] summary{color:var(--text);margin-bottom:6px}
.nc-trash-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--border)}
.nc-trash-kind{font-size:calc(11px * var(--nc-fs,1));color:var(--accent);width:92px;flex:none}
.nc-trash-name{flex:1 1 220px;display:flex;flex-direction:column;min-width:0}
.nc-trash-name small{font-size:calc(11px * var(--nc-fs,1));color:var(--muted)}
.nc-trash-empty{margin-top:8px}
.nc-trash .btn{width:auto}

/* плейлисты листаются отдельно от списка треков */
@media(min-width:851px){.music-layout .music-collections{position:sticky;top:var(--nc-sticky-top,130px);max-height:calc(100vh - var(--nc-sticky-top,130px) - 100px);overflow-y:auto;overscroll-behavior:contain}}

/* RC3.8.14 — импорт книги */
.nc-bookimp{width:min(640px,calc(100vw - 32px));max-height:calc(100vh - 40px);overflow:auto}
.nc-bookimp textarea{width:100%;box-sizing:border-box;font:calc(12px * var(--nc-fs,1))/1.5 ui-monospace,Menlo,Consolas,monospace;min-height:150px}
.nc-bookimp-src{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.nc-bookimp-src .btn{width:auto}
.nc-bookimp-err{margin-top:8px;padding:9px 12px;border-radius:9px;background:#5a1414;color:#fff3ec;font-size:calc(13px * var(--nc-fs,1))}
.nc-bookimp-head{margin:2px 0 10px}
.nc-bookimp-title{font:500 calc(24px * var(--nc-fs,1) * var(--nc-hs,1)) var(--nc-head,Georgia,serif);margin-top:3px}
.nc-bookimp-parts{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:6px;margin:8px 0 14px}

.nc-arc-scale{padding:16px 18px 12px!important;margin-bottom:16px}

.nc-arc-cols{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
.nc-arc-beats,.nc-chrono-main{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:8px}
.nc-arc-side{flex:1 1 300px;display:flex;flex-direction:column;gap:14px;min-width:0}

.nc-arc-actions .btn,.nc-arc-editbar .btn,.nc-ev-actions .btn,.nc-arc-side .btn{width:auto}
.nc-beat{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;border:1px solid var(--border);background:var(--panel)}

.nc-beat-n{flex:none;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:calc(12px * var(--nc-fs,1));font-weight:600;border:1px solid var(--frame);color:var(--muted)}
.nc-beat.done .nc-beat-n{background:var(--accent);border-color:var(--accent);color:#1b1410}

.nc-beat-title{display:flex;flex-wrap:wrap;gap:10px;align-items:baseline}

.nc-beat-title small,.nc-beat-hint{font-size:calc(12px * var(--nc-fs,1));color:var(--muted)}

.nc-beat-chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.nc-chip{display:inline-flex;align-items:center;gap:2px;border-radius:8px;border:1px solid var(--frame);background:var(--soft,var(--panel2));font-size:calc(12px * var(--nc-fs,1));cursor:grab}
.nc-chip .nc-grip{padding-left:6px}
.nc-chip-go{border:0;background:none;color:var(--text);font:inherit;font-size:calc(12px * var(--nc-fs,1));padding:5px 8px;cursor:pointer}

.nc-beat-add{padding:5px 8px;border-radius:8px;border:1px dashed var(--frame);background:transparent;color:var(--muted);font:inherit;font-size:calc(12px * var(--nc-fs,1));max-width:220px}
.nc-beat-note{padding:6px 9px;border-radius:8px;border:1px solid transparent;background:color-mix(in srgb,var(--side) 60%,transparent);color:var(--text);font:inherit;font-size:calc(12px * var(--nc-fs,1))}
.nc-beat-note:focus{border-color:var(--frame);outline:none}
.nc-beat-side{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.nc-beat-side .btn{width:auto}
.nc-beat-badge{font-size:calc(11px * var(--nc-fs,1));font-weight:600;padding:3px 9px;border-radius:999px;border:1px solid var(--frame);color:var(--muted)}
.nc-beat.done .nc-beat-badge{background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--text);border-color:transparent}
.nc-beat.edit{align-items:center}
.nc-beat.edit input[type=text]{flex:1;padding:7px 9px;border-radius:8px;border:1px solid var(--frame);background:var(--side);color:var(--text);font:inherit}
.nc-beat-at{display:flex;align-items:center;gap:5px;font-size:calc(12px * var(--nc-fs,1));color:var(--muted)}
.nc-beat-at input{width:62px;padding:6px;border-radius:8px;border:1px solid var(--frame);background:var(--side);color:var(--text);font:inherit}
.nc-arc-free{display:flex;flex-wrap:wrap;gap:6px;min-height:36px;padding:4px;border-radius:9px}
.nc-chrono-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.nc-chrono-filters{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;padding:14px 16px!important}
.nc-frow{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.nc-flabel{font-size:calc(12px * var(--nc-fs,1));color:var(--muted);min-width:56px}
.nc-fchip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;border:1px solid var(--frame);background:transparent;color:var(--muted);font:inherit;font-size:calc(13px * var(--nc-fs,1));cursor:pointer}
.nc-fchip.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--text)}
.nc-dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}
.nc-fworld{display:inline-flex;gap:6px;align-items:center;font-size:calc(12px * var(--nc-fs,1));color:var(--muted);margin-left:8px}
.nc-fsum{font-size:calc(13px * var(--nc-fs,1));color:var(--accent);border-top:1px solid var(--border);padding-top:7px}
.nc-ln-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:14px;background:var(--side)}
.nc-ln-grid{display:grid}
.nc-ln-corner,.nc-ln-lane{position:sticky;left:0;z-index:2;background:var(--side);padding:12px 14px;border-bottom:1px solid var(--border);font-size:calc(13px * var(--nc-fs,1));display:flex;align-items:center;gap:8px}
.nc-ln-corner{font-size:calc(12px * var(--nc-fs,1));color:var(--muted)}
.nc-ln-col{padding:10px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:2px}
.nc-ln-col b{font:500 calc(15px * var(--nc-fs,1) * var(--nc-hs,1)) var(--nc-head,Georgia,serif)}
.nc-ln-col small{font-size:calc(11px * var(--nc-fs,1));color:var(--muted)}
.nc-ln-cell{position:relative;padding:10px 6px;border-bottom:1px solid var(--panel2);display:flex;align-items:center;min-height:62px;box-sizing:border-box}
.nc-ln-track{position:absolute;left:0;right:0;top:50%;height:2px;opacity:.28}
.nc-ln-pill{position:relative;z-index:1;width:100%;text-align:left;display:flex;flex-direction:column;gap:2px;padding:8px 10px;border-radius:10px;border:1px solid var(--frame);background:var(--panel2);color:var(--text);font:inherit;cursor:pointer}
.nc-ln-pill span{font-size:calc(12px * var(--nc-fs,1));line-height:1.35}
.nc-ln-pill small{font-size:calc(11px * var(--nc-fs,1));color:var(--muted)}
.nc-ln-pill.on,.nc-cl-row.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--panel2))}
.nc-chrono-line{display:flex;flex-direction:column;gap:8px}
.nc-cl-row{display:flex;flex-wrap:wrap;gap:14px;align-items:center;width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--border);background:var(--panel);color:var(--text);font:inherit;text-align:left;cursor:pointer}
.nc-cl-date{flex:0 0 140px;display:flex;flex-direction:column}
.nc-cl-date b{font:500 calc(15px * var(--nc-fs,1) * var(--nc-hs,1)) var(--nc-head,Georgia,serif)}
.nc-cl-date small,.nc-cl-ch small{font-size:calc(11px * var(--nc-fs,1));color:var(--muted)}
.nc-cl-main{flex:1 1 240px;min-width:0;display:flex;flex-direction:column;gap:6px}
.nc-cl-title{font-size:calc(15px * var(--nc-fs,1))}
.nc-cl-tags{display:flex;flex-wrap:wrap;gap:6px}
.nc-ppl{display:inline-flex;align-items:center;gap:5px;font-size:calc(11px * var(--nc-fs,1));padding:2px 8px;border-radius:999px;background:var(--panel2)}

.nc-chrono-empty{padding:26px;border:1px dashed var(--frame);border-radius:14px;text-align:center;color:var(--muted)}
.nc-chrono-empty .btn{width:auto}
.nc-ev-edit{border-color:var(--accent)!important}
.nc-ev-title{font:500 calc(20px * var(--nc-fs,1) * var(--nc-hs,1)) var(--nc-head,Georgia,serif)}
.nc-ev-when{display:grid;grid-template-columns:1fr 1.4fr .8fr;gap:8px}

.nc-arc-side .nc-ev-chk{flex-direction:row;align-items:center;gap:6px;font-size:calc(12px * var(--nc-fs,1));color:var(--text);padding:4px 9px;border-radius:999px;border:1px solid var(--frame)}
.nc-arc-side .nc-ev-chk input{width:auto;padding:0;margin:0;accent-color:var(--accent)}
.nc-chrono-warn p{margin:0;font-size:calc(13px * var(--nc-fs,1));color:var(--accent-hover,var(--accent))}

/* ——— RC3.8.17: «Жизнь истории» во всю ширину, как соседние панели ——— */
.life-landing{max-width:none}
/* ——— RC3.8.17: фокус — лист ровно посередине, панели с двух сторон, «Только лист» ——— */
.nc-zen-left,#ncZenClean{display:none}

.nc-side-btn:hover,.nc-side-btn:focus-visible{opacity:1;border-color:var(--accent);color:var(--text)}
.widget-preview-card .widget-item-heading .nc-side-btn{margin-left:2px}
.widget-arranging .widget-preview-card.nc-on-left{border-left:3px solid color-mix(in srgb,var(--accent) 60%,transparent)}
body.writer-zen .nc-zen-left{display:block;position:sticky;top:24px;margin-top:24px;height:calc(100vh - 48px);overflow-y:auto;scrollbar-width:thin;box-sizing:border-box;padding:0 4px 0 0}

body.writer-zen .nc-zen-slot .np-tools-head{margin-top:0;font-size:calc(12px * var(--nc-fs,1));padding:6px 8px 6px 11px;gap:6px;min-height:38px}
body.writer-zen .nc-zen-slot .np-tools-head>span:first-child{flex:1;min-width:0}
body.writer-zen .nc-zen-slot .np-tools-head .np-toggle{padding:4px 9px;min-height:26px}
body.writer-zen .nc-zen-slot .writer-command-main{padding:10px}
body.writer-zen .nc-zen-slot .writer-command-main .editor-top-triple{grid-template-columns:1fr}
body.writer-zen .nc-zen-slot .writer-command-details{padding:8px 10px}
body.writer-zen .nc-zen-slot .writer-toolline{gap:6px}
body.writer-zen .nc-zen-slot .writer-toolline .cap{flex:1 1 100%}
body.writer-zen .nc-zen-ritual{position:relative}
body.writer-zen .nc-zen-slot .nc-zen-ritual .writer-ritual-holder{display:block!important;width:100%!important;max-width:none!important;margin:0!important}

body.writer-zen .nc-zen-ritual:hover>.nc-side-btn,body.writer-zen .nc-zen-ritual>.nc-side-btn:focus-visible{opacity:.8}
body.writer-zen .nc-zen-slot .daily-progress-widget{border-radius:11px}
#ncZenClean{position:fixed;top:12px;right:calc(28px + var(--nc-exit-w,200px));z-index:999999;align-items:center;background:var(--panel,#28221e);color:var(--text,#f2e6d6);border:1px solid var(--frame,var(--border));padding:10px 14px;border-radius:11px;font:600 calc(13px * var(--nc-fs,1)) var(--nc-ui,sans-serif);box-shadow:0 8px 24px #0005;cursor:pointer}

@media(min-width:1240px){
 body.writer-zen .chapter-writing-layout.modern-chapter-writing,
 body.writer-zen .chapter-writing-layout.modern-chapter-writing:has(.np-side-collapsed){grid-template-columns:minmax(0,1fr) minmax(0,760px) minmax(0,1fr)!important;column-gap:26px;align-items:start}
 body.writer-zen .modern-chapter-writing>.nc-zen-left{grid-column:1;grid-row:1}

 body.writer-zen .modern-chapter-writing>.chapter-writer-sidebar>*{max-width:272px;margin-right:auto}
}

body.writer-zen .chapter-writer-sidebar>.nc-zen-left.nc-zen-inline>*{max-width:none;margin-left:0}

   Кнопки вверху спрятаны и выезжают справа, когда мышь у края экрана (body.nc-zen-edge). */

body.writer-zen.nc-zen-clean .modern-chapter-writing>.chapter-writer-sidebar{display:none!important}

<script>
(async function(){
  try{
    const response=await fetch('/api/boot',{cache:'no-store'});
    if(!response.ok){let why='';try{why=(await response.json()).error||''}catch(_){}throw new Error(why||'Не удалось прочитать библиотеку')}
    window.__NOCTURNE_BOOT=await response.json();
    const script=document.createElement('script');
    script.src='/app.js';
    script.onerror=()=>{document.body.textContent='NOCTURNE: не удалось открыть редактор';};
    document.body.appendChild(script);
  }catch(error){
    /* RC3.7.5: понятный экран вместо одной строки, если библиотека не открылась */
    const box=document.createElement('div');
    box.style.cssText='max-width:620px;margin:12vh auto;padding:32px 36px;border-radius:16px;background:#261f1b;color:#f4e6d0;font:16px/1.6 -apple-system,BlinkMacSystemFont,sans-serif;border:1px solid #46372b';
    const h=document.createElement('h1');h.textContent='NOCTURNE не смог открыть библиотеку';h.style.cssText='font:500 26px/1.3 Georgia,serif;margin:0 0 14px';
    const p1=document.createElement('p');p1.textContent=error.message;p1.style.cssText='margin:0 0 14px;color:#d9ab71';
    const p2=document.createElement('p');p2.textContent='Твои книги не удалены: NOCTURNE ничего не перезаписывает, пока не сможет прочитать библиотеку. Автоматические копии лежат в папке «Документы → NOCTURNE → Резервные копии» (меню «Файл → Открыть папку резервных копий»). Закрой NOCTURNE и открой снова. Если сообщение повторится, не удаляй папку NOCTURNE: из резервной копии библиотеку можно восстановить.';
    p2.style.cssText='margin:0;color:#bda994';
    box.append(h,p1,p2);document.body.replaceChildren(box);document.body.style.background='#16120f';
  }
})();
</script>
<script>
/* NOCTURNE RC3.4 — lightweight editor-panel preference, independent of manuscript save. */
(function(){
'use strict';
const KEY='nocturne.editor.panels.v1';
let prefs;
try { prefs=Object.assign({tools:false,ritual:false,side:false},JSON.parse(localStorage.getItem(KEY)||'{}')); }
catch (_) { prefs={tools:false,ritual:false,side:false}; }
const names={tools:['✎','Оформление и инструменты'],ritual:['⌛','Ритуал письма'],side:['▤','План и виджеты']};
function makeHead(kind,cls){
 const bar=document.createElement('div');bar.className='np-panel-handle '+cls;
 const title=document.createElement('span');const icon=document.createElement('span');icon.className='np-icon';icon.textContent=names[kind][0];title.appendChild(icon);title.appendChild(document.createTextNode(names[kind][1]));
 const btn=document.createElement('button');btn.type='button';btn.className='np-toggle';btn.dataset.nocturnePanel=kind;bar.append(title,btn);return bar;
}
function sync(){
 const bar=document.querySelector('.writer-command-center');
 const wrap=document.querySelector('.chapter-paper-wrap.ritual-writing-unified');
 const aside=document.querySelector('.chapter-writer-sidebar');
 if(!bar||!wrap||!aside)return;
 if(!bar.dataset.npInit){bar.dataset.npInit='1';const head=makeHead('tools','np-tools-head');wrap.insertBefore(head,wrap.firstChild);wrap.insertBefore(bar,head.nextSibling);}
 
 if(!aside.dataset.npInit){aside.dataset.npInit='1';aside.insertBefore(makeHead('side','np-side-head'),aside.firstChild);}
 bar.classList.toggle('np-collapsed',!!prefs.tools);
 wrap.classList.remove('np-ritual-collapsed');
 aside.classList.toggle('np-side-collapsed',!!prefs.side);
 for(const [k,v] of Object.entries(prefs)){
   const btn=document.querySelector('[data-nocturne-panel="'+k+'"]');
   if(btn){btn.textContent=v?'▾ Показать':'▴ Скрыть';btn.setAttribute('aria-expanded',String(!v));btn.setAttribute('aria-label',(v?'Показать ':'Скрыть ')+names[k][1].toLowerCase());}
 }
}
document.addEventListener('click',function(e){
 const btn=e.target.closest('[data-nocturne-panel]');if(!btn)return;
 e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();
 const k=btn.dataset.nocturnePanel;if(!(k in prefs))return;
 prefs[k]=!prefs[k];try{localStorage.setItem(KEY,JSON.stringify(prefs));}catch(_){ }
 sync();
},true);
let pending=false;
new MutationObserver(function(muts){
 // No expensive work for text changes; run only when the panel gets replaced during navigation.
 if(pending)return;
 if(!muts.some(m=>Array.from(m.addedNodes).some(n=>n.nodeType===1&&(n.matches?.('.writer-command-center,.chapter-writing-layout,.chapter-paper-wrap')||n.querySelector?.('.writer-command-center,.chapter-writing-layout,.chapter-paper-wrap')))))return;
 pending=true;requestAnimationFrame(()=>{pending=false;sync();});
}).observe(document.body,{childList:true,subtree:true});
if(document.readyState!=='loading')sync();else document.addEventListener('DOMContentLoaded',sync,{once:true});
})();
</script>
